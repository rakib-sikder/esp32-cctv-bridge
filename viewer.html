<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV</title>
<style>
  :root { color-scheme: light dark;
    --bg:#fff; --fg:#111; --muted:#666; --card:#f4f4f5; --line:#e4e4e7; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e11; --fg:#ededf0; --muted:#9a9aa5; --card:#1a1a20; --line:#2a2a33; --accent:#3b82f6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:22px; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:14px 16px; margin-bottom:12px; }
  .day h2 { font-size:16px; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:13px; }
  button { font:inherit; font-size:14px; padding:8px 16px; margin-top:10px; cursor:pointer;
    background:var(--accent); color:#fff; border:0; border-radius:8px; }
  button[disabled] { opacity:.55; cursor:default; }
  button.ghost { background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  video { width:100%; background:#000; border-radius:10px; margin-top:12px; display:block; }
  .bar { height:4px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .status { color:var(--muted); font-size:13px; margin-top:8px; }
  .err { background:#7f1d1d; color:#fff; padding:12px 14px; border-radius:8px; margin-top:10px; font-size:14px; }
  .note { color:var(--muted); font-size:13px; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CCTV recordings</h1>
  <div class="sub" id="sub">loading&hellip;</div>
  <div id="list"></div>
  <div class="note" id="note"></div>
</div>

<script type="module">
// The listing PAR is written in here at publish time. Anyone with this page's
// URL can read the bucket, so treat the URL as private.
const PAR = "__PAR_URL__";
const FPS = "14";

// ffmpeg.wasm, single threaded so it works without cross-origin isolation
// (Object Storage cannot send the COOP/COEP headers the threaded build needs)
const FF_VER = "0.12.10", CORE_VER = "0.12.6";
const CORE_BASE = `https://unpkg.com/@ffmpeg/core@${CORE_VER}/dist/esm`;

let ffmpeg = null, ffmpegReady = null;

async function getFFmpeg(onNote) {
  if (ffmpegReady) return ffmpegReady;
  ffmpegReady = (async () => {
    onNote("loading the video tool (one time, then cached)…");
    const { FFmpeg } = await import(`https://unpkg.com/@ffmpeg/ffmpeg@${FF_VER}/dist/esm/index.js`);
    const { toBlobURL } = await import(`https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js`);
    const ff = new FFmpeg();
    await ff.load({
      coreURL: await toBlobURL(`${CORE_BASE}/ffmpeg-core.js`, "text/javascript"),
      wasmURL: await toBlobURL(`${CORE_BASE}/ffmpeg-core.wasm`, "application/wasm"),
    });
    ffmpeg = ff;
    return ff;
  })();
  return ffmpegReady;
}

const fmtSize = b => b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : (b/1e6).toFixed(1)+" MB";

async function listPrefix(prefix) {
  let out = [], start = null;
  for (;;) {
    const u = PAR + "?fields=name,size,timeCreated&limit=1000&prefix=" + prefix +
              (start ? "&start=" + encodeURIComponent(start) : "");
    const r = await fetch(u);
    if (!r.ok) throw new Error("listing failed: HTTP " + r.status);
    const j = await r.json();
    out = out.concat(j.objects || []);
    if (!j.nextStartWith) return out;
    start = j.nextStartWith;
  }
}

const dayOf = o => new Date(o.timeCreated).toLocaleDateString("en-CA");

function prettyDay(d) {
  const today = new Date().toLocaleDateString("en-CA");
  const y = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
  if (d === today) return "Today";
  if (d === y) return "Yesterday";
  return new Date(d + "T12:00:00").toLocaleDateString(undefined,
    { weekday: "long", day: "numeric", month: "long" });
}

// Join a day's raw segments and wrap them in mp4. The video itself is left
// alone (-c copy): this phone decodes H.265 directly, so re-encoding would
// only waste time and quality.
async function buildDay(objs, ui) {
  const { bar, status, box, btn } = ui;
  btn.disabled = true;

  const ff = await getFFmpeg(t => status.textContent = t);

  status.textContent = `downloading ${objs.length} clips…`;
  const parts = [];
  let done = 0;
  for (const o of objs) {
    const r = await fetch(PAR + o.name);
    if (r.ok) parts.push(new Uint8Array(await r.arrayBuffer()));
    done++;
    bar.style.width = Math.round(done / objs.length * 70) + "%";
  }

  const total = parts.reduce((a, p) => a + p.length, 0);
  const joined = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { joined.set(p, off); off += p.length; }

  status.textContent = "assembling the video…";
  bar.style.width = "80%";

  await ff.writeFile("in.h265", joined);
  await ff.exec(["-fflags", "+genpts", "-r", FPS, "-i", "in.h265",
                 "-c", "copy", "-movflags", "+faststart", "out.mp4"]);
  const out = await ff.readFile("out.mp4");
  try { await ff.deleteFile("in.h265"); await ff.deleteFile("out.mp4"); } catch {}

  bar.style.width = "100%";
  const blob = new Blob([out.buffer], { type: "video/mp4" });
  const url = URL.createObjectURL(blob);

  const v = document.createElement("video");
  v.controls = true; v.autoplay = true; v.src = url;
  box.appendChild(v);

  const dl = document.createElement("button");
  dl.className = "ghost";
  dl.textContent = "save (" + fmtSize(blob.size) + ")";
  dl.onclick = () => {
    const a = document.createElement("a");
    a.href = url; a.download = ui.day + ".mp4"; a.click();
  };
  box.appendChild(dl);

  status.textContent = "";
  btn.remove();
}

(async () => {
  const sub = document.getElementById("sub");
  const list = document.getElementById("list");
  try {
    const segs = await listPrefix("esp32/");
    if (!segs.length) { sub.textContent = "Nothing recorded yet."; return; }

    const days = {};
    for (const o of segs) (days[dayOf(o)] ||= []).push(o);

    const names = Object.keys(days).sort().reverse();
    const totalBytes = segs.reduce((a, o) => a + (o.size || 0), 0);
    sub.textContent = `${names.length} day(s) · ${segs.length} clips · ${fmtSize(totalBytes)}`;

    for (const d of names) {
      const objs = days[d].sort((a, b) => a.timeCreated < b.timeCreated ? -1 : 1);
      const bytes = objs.reduce((a, o) => a + (o.size || 0), 0);

      const div = document.createElement("div");
      div.className = "day";
      div.innerHTML = `<h2>${prettyDay(d)}</h2>
        <div class="meta">${d} · ${objs.length} clips · ${fmtSize(bytes)}</div>`;

      const btn = document.createElement("button");
      btn.textContent = "play this day";
      const bar = document.createElement("div");
      bar.className = "bar"; bar.innerHTML = "<div></div>";
      const status = document.createElement("div");
      status.className = "status";

      div.append(btn, bar, status);
      list.appendChild(div);

      btn.onclick = async () => {
        try {
          await buildDay(objs, { bar: bar.firstChild, status, box: div, btn, day: d });
        } catch (e) {
          const err = document.createElement("div");
          err.className = "err";
          err.textContent = "Could not build this day: " + e.message;
          div.appendChild(err);
          btn.disabled = false;
        }
      };
    }

    document.getElementById("note").textContent =
      "Clips are joined in your browser - nothing runs on a PC. The video tool " +
      "downloads once on first use and is cached afterwards. Large days take longer.";
  } catch (e) {
    list.innerHTML = `<div class="err">${e.message}</div>`;
    sub.textContent = "";
  }
})();
</script>
</body>
</html>
